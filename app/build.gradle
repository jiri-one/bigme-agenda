plugins { id 'com.android.application' }
layout.buildDirectory = rootProject.layout.projectDirectory.dir('.ai/build/app')
android {
    namespace 'one.jiri.bigmeagenda'
    compileSdk 35
    defaultConfig {
        applicationId 'one.jiri.bigmeagenda'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true; checkReleaseBuilds true }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES']
        resources.merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.mangstadt:vinnie:2.0.2'
    implementation('net.sf.biweekly:biweekly:0.6.8') {
        exclude group: 'com.fasterxml.jackson.core'
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.room:room-runtime:2.5.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
